<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  
  {% seo %}
  
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}?v={{ site.github.build_revision }}">
  <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
  <script src="{{ "/assets/js/script.js" | relative_url }}"></script>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1 class="title">{{ page.title | default: site.title }}</h1>
      
      <!-- Simple Navigation Menu -->
      <nav class="nav-menu" style="margin-top: 15px;">
        <a href="{{ "/" | relative_url }}" style="margin-right: 15px;">Home</a>
        <a href="{{ "/anotherbench.md" | relative_url }}" style="margin-right: 15px;">Weapons Guide</a>
        <!-- Add more links here as you create more pages -->
      </nav>
    </header>
    <div id="container">
      <p class="tagline">{{ site.description }}</p>
      <div id="main" role="main">
        <article class="markdown-body">
          {{ content }}
        </article>
      </div>
    </div>
  </div>
  <div class="current-section">
    <a href="#top">Scroll to top</a>
    <p class="name"></p>
  </div>
</body>
</html>
