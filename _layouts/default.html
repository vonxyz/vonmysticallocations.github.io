<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  
  {% seo %}
  
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}?v={{ site.github.build_revision }}">
  <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
  <script src="{{ "/assets/js/script.js" | relative_url }}"></script>

  <style>
    /* Make guide images show a zoom cursor and subtle hover effect */
    .markdown-body img {
      cursor: zoom-in;
      border-radius: 6px;
      border: 1px solid #444;
      transition: transform 0.15s ease;
    }
    .markdown-body img:hover {
      transform: scale(1.02);
    }

    /* Fullscreen Lightbox Overlay */
    #image-lightbox {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.88);
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
    }
    #image-lightbox img {
      max-width: 92%;
      max-height: 92%;
      border-radius: 8px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1 class="title">{{ page.title | default: site.title }}</h1>
      <h1 class="title">{{ page.title }}</h1>

      <!-- Simple Navigation Menu -->
      <nav class="nav-menu" style="margin-top: 15px;">
        <a href="{{ "/" | relative_url }}" style="margin-right: 15px;">Home</a>
        <a href="{{ "/fentandket" | relative_url }}" style="margin-right: 15px;">Fent And Ket</a>
        <a href="{{ "/anotherbench" | relative_url }}" style="margin-right: 15px;">Weapons Guide</a>
        <!-- Add more links here as you create more pages -->
      </nav>
    </header>
    <div id="container">
      <p class="tagline">{{ page.description | default: site.description }}</p>
      <div id="main" role="main">
        <article class="markdown-body">
          {{ content }}
        </article>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal Container -->
  <div id="image-lightbox">
    <img id="lightbox-img" src="" alt="Enlarged view" />
  </div>

  <div class="current-section">
    <a href="#top">Scroll to top</a>
    <p class="name"></p>
  </div>

  <script>
    $(document).ready(function() {
      // Open lightbox when any article image is clicked
      $('.markdown-body img').on('click', function() {
        var src = $(this).attr('src');
        $('#lightbox-img').attr('src', src);
        $('#image-lightbox').css('display', 'flex');
      });

      // Close lightbox when clicking anywhere on the overlay
      $('#image-lightbox').on('click', function() {
        $(this).hide();
      });

      // Close lightbox when pressing the Escape key
      $(document).on('keydown', function(e) {
        if (e.key === "Escape") {
          $('#image-lightbox').hide();
        }
      });
    });
  </script>
</body>
</html>
